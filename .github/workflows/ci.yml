name: RideShare Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ─── BACKEND CI WORKFLOW ──────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint code checks
        working-directory: ./backend
        run: npm run lint

      - name: Run TypeScript compiler check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Jest test suite
        working-directory: ./backend
        run: npm run test

  # ─── FRONTEND CI WORKFLOW ─────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint code checks
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript compiler check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run Next.js production build compiler
        working-directory: ./frontend
        run: npm run build

  # ─── DOCKER BUILD VERIFICATION ────────────────────────────────────
  docker-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v2

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: rideshare-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: rideshare-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
