version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: rideshare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - rideshare-net

  mongodb:
    image: mongo:7.0
    container_name: rideshare-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rideshare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
      target: runner
    container_name: rideshare-backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      DOCKER: "true"
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/rideshare
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  rideshare-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
