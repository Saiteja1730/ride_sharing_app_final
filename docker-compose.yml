version: '3.9'

services:
  # ──────────────── MongoDB ─────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: rideshare-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: rideshare
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────── Redis ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rideshare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ──────────────── Backend ─────────────────────────
  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
      target: runner
    container_name: rideshare-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      NODE_ENV: production
      DOCKER: "true"
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/rideshare
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────── Frontend ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: rideshare-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rideshare-net

  # ──────────────── Mongo Express (Dev only) ────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: rideshare-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - rideshare-net
    profiles:
      - dev

networks:
  rideshare-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
